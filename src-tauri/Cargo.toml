[package]
name = "thermobox-desktop"
# The version of the app is the one of tauri.conf.json (set from the tag by the workflows)
version = "0.0.0"
description = "Thermobox for Windows, macOS and Linux"
authors = ["IbraxTheKing"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the window of macOS see-through, its material behind (mac.rs)
tauri = { version = "2.12", features = ["macos-private-api"] }
# API calls to the ThermoBox servers: through Rust, not the webview (no mixed content with a
# server in plain http on the local network, from the tauri:// page of macOS and Linux)
tauri-plugin-http = "2.8"
# The servers with a certificate the system does not know (self-signed): trusted by the user
# after comparing its fingerprint, then pinned (tls.rs). Same reqwest and rustls as the plugin.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
sha2 = "0.10"
base64 = "0.22"
# Links of the page (GitHub, release notes) in the browser of the system
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# The place of the window buttons in the header bar drawn by the page (gtk-decoration-layout)
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Liquid Glass behind the window on macOS 26 and up (NSGlassEffectView); mac.rs
tauri-plugin-liquid-glass = "0.1"
# AppKit and WebKit (mac.rs): the traffic lights measured, the swipe between pages of the
# trackpad, the About panel of the system, the settings window that grows with its tab
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSGeometry", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSAttributedString", "NSButton", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSParagraphStyle", "NSResponder", "NSScreen", "NSText", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
# Snap layouts of Windows 11 from the maximize button of the title bar drawn by the page; the
# accent colour of Windows (Préférences › Accent de couleur › Système); « Coller » of the menus
# drawn by the page (the text of the clipboard)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
