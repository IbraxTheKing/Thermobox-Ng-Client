name: Android app
description: >
  Builds the Android app (Capacitor) from the client already built (npm run build), with the
  version of the tag (versionName / versionCode), and puts it in deliverables/: signed APK and AAB
  when the key is given (ANDROID_* secrets), else an installable debug APK. Nothing without an
  android/ folder.

inputs:
  tag:
    description: Version (26.11.0, 26.11.0-beta.1…)
    required: true
  keystore-base64:
    description: Signing key (.jks) in base64 (ANDROID_KEYSTORE_BASE64 secret)
    required: false
    default: ''
  keystore-password:
    required: false
    default: ''
  key-alias:
    required: false
    default: ''
  key-password:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Android project
      id: project
      shell: bash
      run: |
        if [ -d android ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::No android/ folder in the repository: no Android app (npx cap add android, then commit)."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-java@v4
      if: steps.project.outputs.present == 'true'
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle

    - name: Copy the client and prepare the project
      if: steps.project.outputs.present == 'true'
      shell: bash
      run: |
        npx cap sync android
        node scripts/android.mjs prepare
        # Committed from Windows, gradlew may have lost its execute permission
        chmod +x android/gradlew

    - name: Build
      if: steps.project.outputs.present == 'true'
      shell: bash
      env:
        THERMOBOX_VERSION: ${{ inputs.tag }}
        KEY: ${{ inputs.keystore-base64 }}
        KEY_STORE_PASSWORD: ${{ inputs.keystore-password }}
        ALIAS: ${{ inputs.key-alias }}
        ALIAS_PASSWORD: ${{ inputs.key-password }}
      run: |
        eval "$(node scripts/android.mjs version)"
        echo "Android: versionName $name, versionCode $code"
        mkdir -p deliverables
        props=(-PthermoboxVersionName="$name" -PthermoboxVersionCode="$code")
        if [ -n "$KEY" ]; then
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/thermobox.jks"
          (cd android && ./gradlew --no-daemon assembleRelease bundleRelease "${props[@]}" \
            -PthermoboxKeystore="$RUNNER_TEMP/thermobox.jks" -PthermoboxKeystorePassword="$KEY_STORE_PASSWORD" \
            -PthermoboxKeyAlias="$ALIAS" -PthermoboxKeyPassword="$ALIAS_PASSWORD")
          cp android/app/build/outputs/apk/release/app-release.apk "deliverables/thermobox-$THERMOBOX_VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "deliverables/thermobox-$THERMOBOX_VERSION.aab"
          rm -f "$RUNNER_TEMP/thermobox.jks"
        else
          echo "::notice::No signing key (ANDROID_* secrets): debug APK only."
          (cd android && ./gradlew --no-daemon assembleDebug "${props[@]}")
          cp android/app/build/outputs/apk/debug/app-debug.apk "deliverables/thermobox-$THERMOBOX_VERSION-debug.apk"
        fi
        ls -l deliverables
