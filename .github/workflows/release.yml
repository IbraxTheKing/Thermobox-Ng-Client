name: Release assets

# Same logic as the ThermoBox server: a version published by hand (stable 26.11.0, beta, rc) gets
# the client built from its tag, with that version number written into it (scripts/build.mjs):
# the archive of the site, and the Android app (APK / AAB signed when the key is in the ANDROID_*
# secrets, else a debug APK; .github/actions/android).
# The release notes stay those written by hand.
# The nightlies have their own workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the version to complete (e.g. 26.11.0)
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Version
        id: check
        run: |
          case "$TAG" in
            *nightly*) echo "Nightly: files already published by nightly.yml"; echo "build=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        if: steps.check.outputs.build == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Build (version written into the client)
        if: steps.check.outputs.build == 'true'
        run: |
          npm ci
          THERMOBOX_VERSION="$TAG" npm run build

      - name: Archive of the client
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p deliverables
          (cd dist/Thermobox-Ng-Client/browser && zip -qr "$GITHUB_WORKSPACE/deliverables/thermobox-ng-client-$TAG.zip" .)
          ls -l deliverables

      - name: Android app
        if: steps.check.outputs.build == 'true'
        uses: ./.github/actions/android
        with:
          tag: ${{ env.TAG }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # --clobber: running the workflow again replaces the files instead of failing
      - name: Attach the files to the release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" deliverables/* --clobber
