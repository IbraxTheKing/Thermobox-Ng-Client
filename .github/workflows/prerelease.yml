name: Beta / RC

# Thermobox client, same logic as the ThermoBox server (its prerelease.yml).
# Started by hand (Actions tab → "Beta / RC" → Run workflow): publishes a beta or a release
# candidate of the next feature version, built from the dev branch.
#
# Number: the series after the last stable (after 26.10.x: 26.11), then YY.MM.0-beta.N or
# YY.MM.0-rc.N, N = the last of that type for the series + 1 (format of the README).
# The version is written into the client (scripts/build.mjs) and the archive is attached to a
# GitHub pre-release, which the About page of prerelease clients points out.

on:
  workflow_dispatch:
    inputs:
      type:
        description: Type of prerelease
        type: choice
        options: [beta, rc]
        default: beta
        required: true
      branch:
        description: Branch to build
        default: dev
        required: true
      notes:
        description: Text added at the top of the notes (optional; "## Migration" for the operations to plan)
        required: false

permissions:
  contents: write          # create the tag and the pre-release

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag and every branch

      - name: Version
        id: version
        env:
          TYPE: ${{ inputs.type }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if ! git rev-parse -q --verify "origin/$BRANCH^{commit}" >/dev/null; then
            echo "::error::Branch $BRANCH not found"
            exit 1
          fi
          commit=$(git rev-parse "origin/$BRANCH")

          # Series: the one after the last stable (26.10.1 -> 26.11, 26.12.x -> 27.01).
          stable=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$stable" ]; then
            yy=$((10#$(echo "$stable" | cut -d. -f1)))
            mm=$((10#$(echo "$stable" | cut -d. -f2)))
            if [ "$mm" -eq 12 ]; then yy=$((yy + 1)); mm=1; else mm=$((mm + 1)); fi
          else
            # No stable yet: the series of the last prerelease (26.11.0-beta.1 -> 26.11), else the
            # current month's
            pre=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+-' | sed -E 's/^v//; s/-.*//' | sort -V | tail -n1 || true)
            if [ -n "$pre" ]; then
              yy=$((10#$(echo "$pre" | cut -d. -f1)))
              mm=$((10#$(echo "$pre" | cut -d. -f2)))
            else
              yy=$((10#$(date -u +%y)))
              mm=$((10#$(date -u +%m)))
            fi
          fi
          base=$(printf '%d.%02d.0' "$yy" "$mm")
          pattern="^${base//./\\.}-${TYPE}[.-]([0-9]+)$"

          if git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            echo "::error::$base is already published as stable: no more $TYPE for this series."
            exit 1
          fi
          if [ "$TYPE" = beta ] && git tag --list "${base}-rc*" | grep -q .; then
            echo "::warning::An RC of $base already exists: this beta will come before it in the order of versions."
          fi

          last=$(git tag --list "${base}-${TYPE}*" | sed -nE "s/${pattern}/\1/p" | sort -n | tail -n1 || true)
          if [ -n "$last" ]; then
            last_tag=$(git tag --list "${base}-${TYPE}.${last}" "${base}-${TYPE}-${last}" | head -n1)
            if [ "$(git rev-list -n1 "$last_tag")" = "$commit" ]; then
              echo "::error::$last_tag was already published from this commit of $BRANCH."
              exit 1
            fi
          fi
          tag="${base}-${TYPE}.$(( ${last:-0} + 1 ))"

          echo "Last stable: ${stable:-none}; $BRANCH ($commit) -> $tag"
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the branch
        run: git checkout --detach "${{ steps.version.outputs.commit }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Version written into the client (scripts/build.mjs), as -Dthermobox.version of the server
      - name: Build
        run: |
          npm ci
          THERMOBOX_VERSION="${{ steps.version.outputs.tag }}" npm run build

      - name: Archive of the client
        run: |
          mkdir -p deliverables
          (cd dist/Thermobox-Ng-Client/browser && zip -qr "$GITHUB_WORKSPACE/deliverables/thermobox-ng-client-${{ steps.version.outputs.tag }}.zip" .)
          ls -l deliverables

      - name: Android app
        uses: ./.github/actions/android
        with:
          tag: ${{ steps.version.outputs.tag }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" deliverables/* \
            --target "${{ steps.version.outputs.commit }}" \
            --prerelease \
            --title "$tag" \
            --notes "$NOTES" \
            --generate-notes
