name: Beta / RC

# Client Thermobox, même logique que le serveur ThermoBox (son prerelease.yml).
# Lancement manuel (onglet Actions → « Beta / RC » → Run workflow) : publie une beta ou une
# release candidate de la prochaine version fonctionnelle, construite depuis la branche dev.
#
# Numéro : la série qui suit la dernière stable (après 26.10.x : 26.11), puis
# AA.MM.0-beta.N ou AA.MM.0-rc.N, N = le dernier de ce type pour la série + 1 (format du README).
# La version est inscrite dans le client (scripts/construire.mjs) et l'archive est jointe à une
# pre-release GitHub, que la page À propos des clients en prépublication signale.

on:
  workflow_dispatch:
    inputs:
      type:
        description: Type de prépublication
        type: choice
        options: [beta, rc]
        default: beta
        required: true
      branche:
        description: Branche à construire
        default: dev
        required: true
      notes:
        description: Texte ajouté en tête des notes (facultatif ; « ## Migration » pour les opérations à prévoir)
        required: false

permissions:
  contents: write          # créer le tag et la pre-release

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tous les tags et toutes les branches

      - name: Version
        id: version
        env:
          TYPE: ${{ inputs.type }}
          BRANCHE: ${{ inputs.branche }}
        run: |
          if ! git rev-parse -q --verify "origin/$BRANCHE^{commit}" >/dev/null; then
            echo "::error::Branche $BRANCHE introuvable"
            exit 1
          fi
          commit=$(git rev-parse "origin/$BRANCHE")

          # Série : celle qui suit la dernière stable (26.10.1 -> 26.11, 26.12.x -> 27.01).
          stable=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$stable" ]; then
            aa=$((10#$(echo "$stable" | cut -d. -f1)))
            mm=$((10#$(echo "$stable" | cut -d. -f2)))
            if [ "$mm" -eq 12 ]; then aa=$((aa + 1)); mm=1; else mm=$((mm + 1)); fi
          else
            aa=$((10#$(date -u +%y)))
            mm=$((10#$(date -u +%m)))
          fi
          base=$(printf '%d.%02d.0' "$aa" "$mm")
          motif="^${base//./\\.}-${TYPE}[.-]([0-9]+)$"

          if git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            echo "::error::$base est déjà publiée en stable : plus de $TYPE pour cette série."
            exit 1
          fi
          if [ "$TYPE" = beta ] && git tag --list "${base}-rc*" | grep -q .; then
            echo "::warning::Une RC de $base existe déjà : cette beta passera avant elle dans l'ordre des versions."
          fi

          last=$(git tag --list "${base}-${TYPE}*" | sed -nE "s/${motif}/\1/p" | sort -n | tail -n1 || true)
          if [ -n "$last" ]; then
            last_tag=$(git tag --list "${base}-${TYPE}.${last}" "${base}-${TYPE}-${last}" | head -n1)
            if [ "$(git rev-list -n1 "$last_tag")" = "$commit" ]; then
              echo "::error::$last_tag a déjà été publiée depuis ce commit de $BRANCHE."
              exit 1
            fi
          fi
          tag="${base}-${TYPE}.$(( ${last:-0} + 1 ))"

          echo "Dernière stable : ${stable:-aucune} ; $BRANCHE ($commit) -> $tag"
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Passer sur la branche
        run: git checkout --detach "${{ steps.version.outputs.commit }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Version inscrite dans le client (scripts/construire.mjs), comme -Dthermobox.version du serveur
      - name: Construire
        run: |
          npm ci
          THERMOBOX_VERSION="${{ steps.version.outputs.tag }}" npm run build

      - name: Archive du client
        run: |
          mkdir -p livrables
          (cd dist/Thermobox-Ng-Client/browser && zip -qr "$GITHUB_WORKSPACE/livrables/thermobox-ng-client-${{ steps.version.outputs.tag }}.zip" .)
          ls -l livrables

      - name: Créer la pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" livrables/* \
            --target "${{ steps.version.outputs.commit }}" \
            --prerelease \
            --title "$tag" \
            --notes "$NOTES" \
            --generate-notes
