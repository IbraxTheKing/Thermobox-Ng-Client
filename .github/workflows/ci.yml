name: Vérification

# À chaque push et pull request sur main et dev : le client se construit (Node 24, comme les
# versions publiées) et, s'il y a un dossier android/, l'application Android aussi, avec le plugin
# natif (plugins/thermobox-native). L'APK de debug est gardé une semaine dans les artefacts du run,
# pour l'essayer sur un téléphone.
# Remplace le modèle « NodeJS with Webpack » de GitHub (ce projet n'utilise pas webpack).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags : la version inscrite est celle du commit s'il en a une

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Construire le client
        run: |
          npm ci
          npm run build

      - name: Application Android (debug)
        uses: ./.github/actions/android
        with:
          tag: dev

      - name: Garder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: thermobox-android-debug
          path: livrables/*.apk
          retention-days: 7
          if-no-files-found: ignore
