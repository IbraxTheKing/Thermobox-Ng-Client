name: Check

# On every push and pull request on main and dev: the client builds (Node 24, as the published
# versions) and, when there is an android/ folder, the Android app too, with the native plugin
# (plugins/thermobox-native). The debug APK is kept a week in the artifacts of the run, to try it
# on a phone.
# Replaces GitHub's "NodeJS with Webpack" template (this project does not use webpack).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: the version written is the commit's when it has one

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build the client
        run: |
          npm ci
          npm run build

      - name: Android app (debug)
        uses: ./.github/actions/android
        with:
          tag: dev

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: thermobox-android-debug
          path: deliverables/*.apk
          retention-days: 7
          if-no-files-found: ignore
