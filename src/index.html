<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thermobox</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="The temperature of every room, at a glance." />
    <meta name="theme-color" content="#bccde2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Thermobox" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <!-- Canvas colour before the stylesheet loads: no white flash -->
    <style>html{background:#bccde2}@media (prefers-color-scheme:dark){html{background:#0f141c}}</style>
    <!-- Windows app (Tauri): its title bar at once, before the client has loaded (TbDesktopChrome then) -->
    <style>
      #tb-boot-titlebar{position:fixed;inset:0 0 auto 0;z-index:3000;display:flex;align-items:center;height:32px;padding-left:16px;font:12px/16px "Segoe UI Variable Text","Segoe UI",sans-serif;color:#1b1b1b;user-select:none}
      #tb-boot-titlebar span{flex:1;pointer-events:none}
      #tb-boot-titlebar button{width:46px;height:32px;border:0;background:none;color:inherit;font:10px/1 "Segoe Fluent Icons","Segoe MDL2 Assets"}
      #tb-boot-titlebar button:hover{background:rgba(0,0,0,.0373)}
      #tb-boot-titlebar button.x:hover{background:#c42b1c;color:#fff}
      @media (prefers-color-scheme:dark){#tb-boot-titlebar{color:#fff}#tb-boot-titlebar button:hover{background:rgba(255,255,255,.0605)}}
      html[data-desktop="windows"]:not([data-theme]){background:#f3f3f3}
      @media (prefers-color-scheme:dark){html[data-desktop="windows"]:not([data-theme]){background:#202020}}
    </style>
  </head>
  <body>
    <script>
      // Windows app: the window has no title bar of the system (tauri.windows.conf.json)
      (function () {
        var t = window.__TAURI_INTERNALS__;
        if (!t || !/Windows/.test(navigator.userAgent)) return;
        document.documentElement.setAttribute('data-desktop', 'windows');
        var b = document.createElement('div');
        b.id = 'tb-boot-titlebar';
        b.setAttribute('data-tauri-drag-region', '');
        b.innerHTML = '<span>Thermobox</span><button data-a="minimize">&#xE921;</button><button data-a="toggle_maximize">&#xE922;</button><button data-a="close" class="x">&#xE8BB;</button>';
        b.addEventListener('click', function (e) {
          var a = e.target.getAttribute && e.target.getAttribute('data-a');
          if (a) t.invoke('plugin:window|' + a, { label: 'main' });
        });
        document.body.appendChild(b);
        // The page draws its title bar: Windows need not give its own back (main.rs)
        t.invoke('page_ready');
      })();
    </script>
    <app-root></app-root>
    <noscript>Thermobox needs JavaScript. Thermobox a besoin de JavaScript.</noscript>
  </body>
</html>
