<!doctype html>
<!-- The page of the web client and the mobile apps (the desktop apps of Windows and Linux: src/platforms/<system>/index.html, the same with their frame) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thermobox</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="The temperature of every room, at a glance." />
    <meta name="theme-color" content="#bccde2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Thermobox" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <!-- Canvas colour before the stylesheet loads: no white flash -->
    <style>html{background:#bccde2}@media (prefers-color-scheme:dark){html{background:#0f141c}}</style>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Thermobox needs JavaScript. Thermobox a besoin de JavaScript.</noscript>
  </body>
</html>
