
services:
  thermobox-ng-client:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: thermobox-ng-client

    ports:
      - "2767:80"

    restart: unless-stopped

    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    develop:
      watch:
        # Tout changement du code Angular reconstruit l'image
        # et recrée le conteneur.
        - action: rebuild
          path: ./src
          ignore:
            - "**/node_modules/**"
            - "**/*.spec.ts"

        # Les dépendances doivent être réinstallées si elles changent.
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json

        # Configuration de compilation Angular.
        - action: rebuild
          path: ./angular.json

        - action: rebuild
          path: ./tsconfig.json

        # Configuration Nginx intégrée à l'image.
        - action: rebuild
          path: ./nginx

        # Toute modification du Dockerfile nécessite une reconstruction.
        - action: rebuild
          path: ./Dockerfile
