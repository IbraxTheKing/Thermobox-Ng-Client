
services:
  thermobox-ng-client:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: thermobox-ng-client

    ports:
      - "2767:80"

    restart: unless-stopped

    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    develop:
      watch:
        # Any change of the Angular code rebuilds the image
        # and recreates the container.
        - action: rebuild
          path: ./src
          ignore:
            - "**/node_modules/**"
            - "**/*.spec.ts"

        # The dependencies must be installed again when they change.
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json

        # Angular build configuration.
        - action: rebuild
          path: ./angular.json

        - action: rebuild
          path: ./tsconfig.json

        # Nginx configuration built into the image.
        - action: rebuild
          path: ./nginx

        # Any change of the Dockerfile needs a rebuild.
        - action: rebuild
          path: ./Dockerfile
